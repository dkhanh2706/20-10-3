<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chúc mừng 20/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff8fab;
        --rose: #e11d48;
        --text: #fff1f5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Quicksand", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse at 50% 30%, #7a1d4a 0%, transparent 60%),
          radial-gradient(ellipse at 20% 90%, #5b1a5e 0%, transparent 55%),
          linear-gradient(160deg, #2a0a24 0%, #4a1238 50%, #2b0b2e 100%);
        overflow-x: hidden;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        touch-action: manipulation;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .bokeh {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .bokeh i {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 182, 203, 0.55),
          rgba(255, 182, 203, 0) 70%
        );
        animation: twinkle var(--d, 6s) ease-in-out infinite;
        animation-delay: var(--l, 0s);
        opacity: 0;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.6) translateY(0);
        }
        50% {
          opacity: 0.9;
          transform: scale(1) translateY(-14px);
        }
      }

      main {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 520px;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(18px, env(safe-area-inset-top)) 18px
          max(22px, env(safe-area-inset-bottom));
        text-align: center;
        gap: 6px;
      }
      .badge {
        font-size: 0.8rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #ffc2d4;
        opacity: 0;
        animation: fadeUp 1.2s 0.2s ease forwards;
      }
      h1 {
        font-family: "Dancing Script", cursive;
        font-size: clamp(2.1rem, 9vw, 3.2rem);
        line-height: 1.15;
        background: linear-gradient(90deg, #ffd1dc, #ff6b9a, #ffd1dc);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          fadeUp 1.4s 0.4s ease forwards,
          shine 6s linear infinite;
        opacity: 0;
        filter: drop-shadow(0 4px 14px rgba(255, 80, 130, 0.35));
      }
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .heart-beat {
        width: 34px;
        height: 34px;
        margin: 2px 0;
        filter: drop-shadow(0 0 10px rgba(255, 40, 90, 0.8));
        animation: beat 1.4s ease-in-out infinite;
        opacity: 0;
        animation-name: beat, fadeUp;
        animation-duration: 1.4s, 1s;
        animation-delay: 0s, 0.8s;
        animation-iteration-count: infinite, 1;
        animation-fill-mode: none, forwards;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.22);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.14);
        }
        60% {
          transform: scale(1);
        }
      }

      .bouquet {
        width: min(86vw, 400px);
        height: auto;
        overflow: visible;
        margin-top: -2px;
      }
      .bloom {
        transform-origin: 200px 400px;
        transform: scale(0);
        opacity: 0;
        animation: grow 1.6s cubic-bezier(0.2, 0.9, 0.25, 1.15) forwards;
        animation-delay: var(--g, 0s);
      }
      @keyframes grow {
        0% {
          transform: scale(0) rotate(-8deg);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }
      .sway {
        transform-origin: 200px 400px;
        animation: sway var(--s, 5s) ease-in-out infinite alternate;
        animation-delay: var(--sd, 0s);
      }
      @keyframes sway {
        from {
          transform: rotate(-1.8deg);
        }
        to {
          transform: rotate(1.8deg);
        }
      }
      .paper {
        opacity: 0;
        animation: fadeIn 1.2s 1.6s ease forwards;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      .bow {
        transform-origin: 200px 380px;
        opacity: 0;
        animation:
          fadeIn 1s 2s ease forwards,
          bowPulse 4s 3s ease-in-out infinite;
      }
      @keyframes bowPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .spark {
        animation: sparkle 3s ease-in-out infinite;
        animation-delay: var(--sd, 0s);
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .msg {
        font-size: clamp(0.95rem, 3.9vw, 1.1rem);
        line-height: 1.65;
        color: #ffe3ec;
        max-width: 380px;
        min-height: 3.4em;
        opacity: 0;
        animation: fadeUp 1.4s 2.4s ease forwards;
      }
      button {
        margin-top: 10px;
        font:
          600 1rem "Quicksand",
          sans-serif;
        color: #fff;
        padding: 13px 28px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        background: linear-gradient(135deg, #ff4d7d, #e11d48);
        box-shadow:
          0 8px 24px rgba(225, 29, 72, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        opacity: 0;
        animation: fadeUp 1.2s 3s ease forwards;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }
      button:active {
        transform: scale(0.94);
      }
      @media (hover: hover) {
        button:hover {
          transform: translateY(-2px);
          box-shadow: 0 12px 28px rgba(225, 29, 72, 0.6);
        }
      }
      .hint {
        font-size: 0.75rem;
        color: #d79ab0;
        opacity: 0;
        animation: fadeUp 1s 3.4s ease forwards;
      }

      @media (max-height: 700px) {
        .bouquet {
          width: min(70vw, 320px);
        }
        .heart-beat {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bokeh" id="bokeh"></div>
    <canvas id="fx"></canvas>

    <main>
      <div class="badge">20 · 10</div>
      <h1>Chúc mừng ngày<br />Phụ nữ Việt Nam của My cô hồn</h1>

      <svg class="heart-beat" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5a7e" />
            <stop offset="1" stop-color="#c2002f" />
          </linearGradient>
        </defs>
        <path
          fill="url(#hg)"
          d="M16 29C6 21 2 15.5 2 10.5 2 6.4 5.2 3.5 9 3.5c2.7 0 5 1.4 7 4 2-2.6 4.3-4 7-4 3.8 0 7 2.9 7 7 0 5-4 10.5-14 18.5z"
        />
        <path
          fill="rgba(255,255,255,.35)"
          d="M8 8.5c1.6-1.2 3.6-.9 4.6.4-1.7-.3-3.5.3-4.6-.4z"
        />
      </svg>

      <svg
        class="bouquet"
        id="bouquet"
        viewBox="0 0 400 500"
        role="img"
        aria-label="Bó hoa hồng"
      >
        <defs>
          <!-- Hoa hồng: dùng currentColor để đổi màu -->
          <g id="rose">
            <g
              fill="currentColor"
              stroke="rgba(60,0,20,.28)"
              stroke-width="1.2"
            >
              <ellipse cx="0" cy="-16" rx="22" ry="29" />
              <ellipse cx="0" cy="-16" rx="22" ry="29" transform="rotate(72)" />
              <ellipse
                cx="0"
                cy="-16"
                rx="22"
                ry="29"
                transform="rotate(144)"
              />
              <ellipse
                cx="0"
                cy="-16"
                rx="22"
                ry="29"
                transform="rotate(216)"
              />
              <ellipse
                cx="0"
                cy="-16"
                rx="22"
                ry="29"
                transform="rotate(288)"
              />
            </g>
            <circle
              r="21"
              fill="currentColor"
              stroke="rgba(60,0,20,.3)"
              stroke-width="1.2"
            />
            <circle r="21" fill="rgba(255,255,255,.1)" />
            <circle
              r="13"
              fill="currentColor"
              stroke="rgba(60,0,20,.35)"
              stroke-width="1.2"
            />
            <path
              d="M-9 1C-9-10 9-10 9 1C9 10-5 11-6 4C-6-2 2-3 3 1"
              fill="none"
              stroke="rgba(60,0,20,.5)"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M-30 -14C-24 -26 -10 -34 4 -33"
              fill="none"
              stroke="rgba(255,255,255,.28)"
              stroke-width="3"
              stroke-linecap="round"
            />
          </g>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3fae6a" />
            <stop offset="1" stop-color="#1d6b45" />
          </linearGradient>
          <linearGradient id="paper1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd6e3" />
            <stop offset="1" stop-color="#ff8fb3" />
          </linearGradient>
          <linearGradient id="paper2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9ebb" />
            <stop offset="1" stop-color="#e0527d" />
          </linearGradient>
          <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff5a86" />
            <stop offset="1" stop-color="#c2185b" />
          </linearGradient>
        </defs>
        <g id="plant"></g>

        <!-- giấy gói -->
        <g class="paper">
          <path
            d="M100 332 Q200 352 300 332 L214 494 Q200 502 186 494 Z"
            fill="url(#paper2)"
          />
          <path
            d="M100 332 Q150 345 200 345 L200 497 L186 494 Z"
            fill="url(#paper1)"
            opacity=".95"
          />
          <path
            d="M300 332 Q250 345 200 345 L200 497 L214 494 Z"
            fill="url(#paper2)"
            opacity=".9"
          />
          <path
            d="M130 336 L192 490 M270 336 L208 490"
            stroke="rgba(255,255,255,.35)"
            stroke-width="1.5"
            fill="none"
          />
          <path
            d="M100 332 Q200 352 300 332"
            fill="none"
            stroke="rgba(255,255,255,.6)"
            stroke-width="2"
          />
        </g>

        <!-- nơ -->
        <g class="bow">
          <path
            d="M200 382 C150 340 118 386 164 398 C180 401 192 392 200 382Z"
            fill="url(#ribbon)"
          />
          <path
            d="M200 382 C250 340 282 386 236 398 C220 401 208 392 200 382Z"
            fill="url(#ribbon)"
          />
          <path
            d="M200 388 L176 440 L192 434 L200 450 L208 434 L224 440 Z"
            fill="url(#ribbon)"
            opacity=".95"
          />
          <circle cx="200" cy="388" r="9" fill="#ff7aa0" />
          <circle cx="197" cy="385" r="3" fill="rgba(255,255,255,.55)" />
        </g>

        <g id="sparks"></g>
      </svg>

      <p class="msg" id="msg"></p>
    </main>

    <script>
      (function () {
        /* ================= BÓ HOA (SVG) ================= */
        var NS = "http://www.w3.org/2000/svg";
        var plant = document.getElementById("plant");
        var sparks = document.getElementById("sparks");
        var BASE = { x: 200, y: 400 };

        var leaves = [
          { x: 78, y: 250, r: -62, s: 1.25 },
          { x: 322, y: 250, r: 62, s: 1.25 },
          { x: 60, y: 300, r: -80, s: 1.0 },
          { x: 340, y: 300, r: 80, s: 1.0 },
          { x: 200, y: 92, r: 0, s: 1.0 },
          { x: 140, y: 120, r: -35, s: 0.9 },
          { x: 262, y: 120, r: 35, s: 0.9 },
          { x: 112, y: 340, r: -110, s: 0.9 },
          { x: 288, y: 340, r: 110, s: 0.9 },
        ];
        var flowers = [
          // hàng sau
          { x: 128, y: 196, s: 0.92, c: "#e11d48" },
          { x: 200, y: 158, s: 1.05, c: "#be123c" },
          { x: 272, y: 196, s: 0.92, c: "#fb7185" },
          // hàng giữa
          { x: 88, y: 262, s: 0.82, c: "#f472b6" },
          { x: 154, y: 238, s: 0.98, c: "#ef4444" },
          { x: 246, y: 238, s: 0.98, c: "#f9a8d4" },
          { x: 312, y: 262, s: 0.82, c: "#e11d48" },
          // hàng trước
          { x: 122, y: 302, s: 0.8, c: "#fb7185" },
          { x: 200, y: 288, s: 1.0, c: "#dc2626" },
          { x: 278, y: 302, s: 0.8, c: "#f43f5e" },
        ];
        var fillers = [
          [60, 200],
          [48, 238],
          [340, 206],
          [352, 240],
          [170, 120],
          [230, 118],
          [100, 150],
          [300, 152],
          [70, 330],
          [330, 330],
          [200, 60],
          [160, 75],
          [240, 75],
        ];

        function el(tag, attrs) {
          var e = document.createElementNS(NS, tag);
          for (var k in attrs) e.setAttribute(k, attrs[k]);
          return e;
        }

        // lá
        var leafGroup = el("g", { class: "bloom" });
        leafGroup.style.setProperty("--g", "0.1s");
        var leafSway = el("g", { class: "sway" });
        leafSway.style.setProperty("--s", "6s");
        leaves.forEach(function (l) {
          var g = el("g", {
            transform:
              "translate(" +
              l.x +
              " " +
              l.y +
              ") rotate(" +
              l.r +
              ") scale(" +
              l.s +
              ")",
          });
          g.appendChild(
            el("path", {
              d: "M0 0 C-22 -28 -10 -64 0 -74 C10 -64 22 -28 0 0Z",
              fill: "url(#leaf)",
            }),
          );
          g.appendChild(
            el("path", {
              d: "M0 -4 L0 -66",
              stroke: "rgba(255,255,255,.35)",
              "stroke-width": 1.5,
              fill: "none",
            }),
          );
          leafSway.appendChild(g);
        });
        leafGroup.appendChild(leafSway);
        plant.appendChild(leafGroup);

        // hoa nhí (baby's breath)
        var fg = el("g", { class: "bloom" });
        fg.style.setProperty("--g", "0.6s");
        var fs = el("g", { class: "sway" });
        fs.style.setProperty("--s", "4.4s");
        fs.style.setProperty("--sd", "-1s");
        fillers.forEach(function (p) {
          fs.appendChild(
            el("path", {
              d:
                "M" +
                BASE.x +
                " " +
                BASE.y +
                " Q" +
                (BASE.x + p[0]) / 2 +
                " " +
                (p[1] + 90) +
                " " +
                p[0] +
                " " +
                p[1],
              stroke: "#2f8a5a",
              "stroke-width": 1.6,
              fill: "none",
            }),
          );
          [
            [0, 0, 4.2],
            [-6, 5, 3],
            [6, 4, 3.2],
            [2, -6, 2.6],
          ].forEach(function (d) {
            fs.appendChild(
              el("circle", {
                cx: p[0] + d[0],
                cy: p[1] + d[1],
                r: d[2],
                fill: "#fff4f8",
              }),
            );
          });
        });
        fg.appendChild(fs);
        plant.appendChild(fg);

        // hoa hồng
        flowers.forEach(function (f, i) {
          var grow = el("g", { class: "bloom" });
          grow.style.setProperty("--g", (0.5 + i * 0.13).toFixed(2) + "s");
          var sway = el("g", { class: "sway" });
          sway.style.setProperty("--s", (4 + (i % 4) * 0.7).toFixed(1) + "s");
          sway.style.setProperty("--sd", (-i * 0.55).toFixed(2) + "s");
          sway.appendChild(
            el("path", {
              d:
                "M" +
                BASE.x +
                " " +
                BASE.y +
                " Q" +
                (BASE.x + f.x) / 2 +
                " " +
                ((BASE.y + f.y) / 2 + 20) +
                " " +
                f.x +
                " " +
                (f.y + 20),
              stroke: "#26784d",
              "stroke-width": 4.5,
              fill: "none",
              "stroke-linecap": "round",
            }),
          );
          var r = el("use", {
            href: "#rose",
            transform:
              "translate(" +
              f.x +
              " " +
              f.y +
              ") scale(" +
              f.s +
              ") rotate(" +
              (((i * 37) % 60) - 30) +
              ")",
          });
          r.style.color = f.c;
          sway.appendChild(r);
          grow.appendChild(sway);
          plant.appendChild(grow);
        });

        // lấp lánh
        [
          [58, 170],
          [345, 180],
          [200, 40],
          [110, 100],
          [292, 100],
          [30, 280],
          [372, 290],
        ].forEach(function (p, i) {
          var s = el("path", {
            class: "spark",
            d: "M0 -9 Q1.5 -1.5 9 0 Q1.5 1.5 0 9 Q-1.5 1.5 -9 0 Q-1.5 -1.5 0 -9Z",
            transform: "translate(" + p[0] + " " + p[1] + ")",
            fill: "#fff3b0",
          });
          s.style.setProperty("--sd", i * 0.45 + "s");
          sparks.appendChild(s);
        });

        /* ================= NỀN BOKEH ================= */
        var bokeh = document.getElementById("bokeh");
        for (var i = 0; i < 18; i++) {
          var b = document.createElement("i");
          var sz = 30 + Math.random() * 90;
          b.style.cssText =
            "width:" +
            sz +
            "px;height:" +
            sz +
            "px;left:" +
            Math.random() * 100 +
            "%;top:" +
            Math.random() * 100 +
            "%;";
          b.style.setProperty("--d", (5 + Math.random() * 6).toFixed(1) + "s");
          b.style.setProperty("--l", (-Math.random() * 8).toFixed(1) + "s");
          bokeh.appendChild(b);
        }

        /* ================= LỜI CHÚC (gõ chữ) ================= */
        var text =
          "Chúc My ngày 20/10 vui vẻ, mạnh khỏe, xinh đẹp, xuất hiện nhiều vào đùng để triệu hồi ";
        var msg = document.getElementById("msg");
        var idx = 0;
        function typeIt() {
          var chars = Array.from(text);
          if (idx <= chars.length) {
            msg.textContent = chars.slice(0, idx).join("");
            idx++;
            setTimeout(typeIt, 55);
          }
        }
        setTimeout(typeIt, 2600);

        /* ================= CANVAS: CÁNH HOA + TIM ================= */
        var cv = document.getElementById("fx");
        var ctx = cv.getContext("2d");
        var W = 0,
          H = 0,
          dpr = Math.min(window.devicePixelRatio || 1, 2);
        function resize() {
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = W * dpr;
          cv.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener("resize", resize);

        var isMobile = W < 600;
        var MAX_PETALS = isMobile ? 26 : 48;
        var petals = [],
          hearts = [];
        var petalColors = [
          ["#ff5c8a", "#c2185b"],
          ["#ff8fab", "#e0457b"],
          ["#e11d48", "#9f1239"],
          ["#ffb3c6", "#f06292"],
          ["#ff3d71", "#b0003a"],
        ];

        function newPetal(initial) {
          var c = petalColors[(Math.random() * petalColors.length) | 0];
          return {
            x: Math.random() * W,
            y: initial ? Math.random() * H : -30 - Math.random() * 80,
            s: 7 + Math.random() * 8,
            vy: 28 + Math.random() * 38,
            vx: -8 + Math.random() * 16,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 1.6,
            flip: Math.random() * Math.PI * 2,
            vf: 1.2 + Math.random() * 2,
            sw: 18 + Math.random() * 30,
            sp: 0.6 + Math.random() * 1.1,
            ph: Math.random() * Math.PI * 2,
            c1: c[0],
            c2: c[1],
            a: 0.75 + Math.random() * 0.25,
          };
        }
        for (var p = 0; p < MAX_PETALS; p++) petals.push(newPetal(true));

        function heartPath(s) {
          ctx.beginPath();
          ctx.moveTo(0, s * 0.9);
          ctx.bezierCurveTo(
            -s * 1.4,
            -s * 0.1,
            -s * 0.7,
            -s * 1.1,
            0,
            -s * 0.4,
          );
          ctx.bezierCurveTo(s * 0.7, -s * 1.1, s * 1.4, -s * 0.1, 0, s * 0.9);
          ctx.closePath();
        }

        var hColors = ["#ff2d55", "#ff4d7d", "#e11d48", "#ff6b9a", "#ff1744"];
        function addHeart(x, y, burst) {
          var ang = Math.random() * Math.PI * 2,
            sp = burst ? 70 + Math.random() * 150 : 0;
          hearts.push({
            x: x,
            y: y,
            vx: burst ? Math.cos(ang) * sp : (Math.random() - 0.5) * 20,
            vy: burst ? Math.sin(ang) * sp - 60 : -(40 + Math.random() * 50),
            s: burst ? 6 + Math.random() * 9 : 6 + Math.random() * 10,
            life: 0,
            max: burst ? 2.2 + Math.random() * 1.2 : 5 + Math.random() * 3,
            ph: Math.random() * 6.28,
            c: hColors[(Math.random() * hColors.length) | 0],
            burst: !!burst,
          });
        }
        function burstAt(x, y, n) {
          for (var i = 0; i < n; i++) addHeart(x, y, true);
        }

        // tim bay lên nhẹ nhàng từ phía dưới
        var nextHeart = 0;

        function drawPetal(p) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, Math.max(0.18, Math.abs(Math.cos(p.flip))));
          var s = p.s;
          var g = ctx.createLinearGradient(0, -s, 0, s);
          g.addColorStop(0, p.c1);
          g.addColorStop(1, p.c2);
          ctx.globalAlpha = p.a;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.bezierCurveTo(s * 0.95, -s * 0.6, s * 0.85, s * 0.7, 0, s);
          ctx.bezierCurveTo(-s * 0.85, s * 0.7, -s * 0.95, -s * 0.6, 0, -s);
          ctx.fill();
          ctx.restore();
        }

        var last = performance.now(),
          t = 0;
        function loop(now) {
          var dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          t += dt;
          ctx.clearRect(0, 0, W, H);

          for (var i = 0; i < petals.length; i++) {
            var p = petals[i];
            p.y += p.vy * dt;
            p.x += (p.vx + Math.sin(t * p.sp + p.ph) * p.sw) * dt;
            p.rot += p.vr * dt;
            p.flip += p.vf * dt;
            if (p.y > H + 30 || p.x < -40 || p.x > W + 40)
              petals[i] = newPetal(false);
            else drawPetal(p);
          }

          nextHeart -= dt;
          if (nextHeart <= 0) {
            addHeart(W * (0.15 + Math.random() * 0.7), H + 10, false);
            nextHeart = isMobile ? 0.75 : 0.45;
          }
          for (var j = hearts.length - 1; j >= 0; j--) {
            var h = hearts[j];
            h.life += dt;
            if (h.burst) {
              h.vy += 180 * dt;
              h.vx *= 1 - 1.2 * dt;
            }
            h.x += (h.vx + (h.burst ? 0 : Math.sin(t * 1.6 + h.ph) * 16)) * dt;
            h.y += h.vy * dt;
            var k = h.life / h.max;
            if (k >= 1 || h.y < -30) {
              hearts.splice(j, 1);
              continue;
            }
            var alpha = k < 0.12 ? k / 0.12 : (1 - k) / (1 - 0.12);
            var pulse = 1 + Math.sin(t * 5 + h.ph) * 0.06;
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(Math.sin(t + h.ph) * 0.25);
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.9;
            ctx.fillStyle = h.c;
            heartPath(h.s * pulse);
            ctx.fill();
            ctx.globalAlpha *= 0.55;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.ellipse(
              -h.s * 0.45,
              -h.s * 0.45,
              h.s * 0.16,
              h.s * 0.1,
              -0.6,
              0,
              6.28,
            );
            ctx.fill();
            ctx.restore();
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(function (n) {
          last = n;
          loop(n);
        });

        /* ================= TƯƠNG TÁC ================= */
        window.addEventListener("pointerdown", function (e) {
          if (e.target.closest("button")) return;
          burstAt(e.clientX, e.clientY, isMobile ? 9 : 14);
        });
        document.getElementById("btn").addEventListener("click", function (e) {
          var r = this.getBoundingClientRect();
          burstAt(r.left + r.width / 2, r.top + r.height / 2, 26);
          for (var i = 0; i < 10; i++) {
            var pt = newPetal(false);
            pt.x = Math.random() * W;
            pt.y = -10 - Math.random() * 60;
            pt.vy *= 1.3;
            petals.push(pt);
          }
          // tự dọn bớt cánh hoa dư
          setTimeout(function () {
            if (petals.length > MAX_PETALS)
              petals.splice(0, petals.length - MAX_PETALS);
          }, 9000);
        });

        // mở màn: một đợt tim chào mừng
        setTimeout(function () {
          burstAt(W / 2, H * 0.45, 16);
        }, 2200);
      })();
    </script>
  </body>
</html>
